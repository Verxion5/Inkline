services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bunx vite dev --port 3000 --host 0.0.0.0"]
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - HOST=0.0.0.0
    env_file:
      - .env
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
