services:
  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - bun_cache:/root/.bun
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - .env
      - /run/base44/app.env
    command: sh -c "bun install && bun run dev --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  bun_cache:
  node_modules:
